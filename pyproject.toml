[project]
  name            = "timeclock-schema"
  version         = "0.1.0"
  description     = "Shared models, shift logic and SQL migrations for timeclock-system and timeclock-backend"
  readme          = "README.md"
  requires-python = ">=3.14"
  dependencies    = ["pydantic>=2.13"]

[dependency-groups]
  dev = [
    "aeth-devkit>=15.1.1",
    "psycopg[binary]>=3.2.10",
    "pytest>=8.0",
  ]

[build-system]
  requires      = ["uv_build>=0.11.2,<0.12.0"]
  build-backend = "uv_build"

[tool.poe]
  include_script = [{ script = "aeth_devkit:tasks", executor = { type = "uv", frozen = true } }]

[tool.uv]
  [tool.uv.sources]
    aeth-devkit = [{ index = "SFTPyPI" }]

  [[tool.uv.index]]
    name        = "SFTPyPI"
    url         = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/+simple"
    publish-url = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/"
    explicit    = true
